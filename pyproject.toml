[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "phoenix-heatsafe-transit"
version = "0.1.0"
description = "A public-interest data platform for Phoenix transit heat risk and investment prioritization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "geopandas>=1.0,<2",
  "pandas>=2.2,<3",
  "pyarrow>=17,<20",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

